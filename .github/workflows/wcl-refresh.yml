name: Refresh WCL GitHub snapshots

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "How many roster members to refresh in this run. Empty = config default."
        required: false
        type: string
      max_fights:
        description: "Maximum detailed WCL fights to scan in this run. Empty = config default."
        required: false
        type: string
      max_queries:
        description: "Maximum WCL GraphQL queries in this run. Empty = config default."
        required: false
        type: string
      min_fight_duration_ms:
        description: "Skip accidental micro-pulls shorter than this duration. Empty = config default."
        required: false
        type: string
      target_new_pulls:
        description: "Stop early after every selected member gets this many new pulls. Empty = config default."
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: wcl-guild-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-online --no-audit --fund=false

      - name: Refresh incremental WCL snapshots inside GitHub
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          BATTLENET_CLIENT_ID: ${{ secrets.BATTLENET_CLIENT_ID }}
          BATTLENET_CLIENT_SECRET: ${{ secrets.BATTLENET_CLIENT_SECRET }}
          WCL_MEMBER_BATCH_SIZE: ${{ inputs.batch_size }}
          WCL_MAX_FIGHTS_PER_RUN: ${{ inputs.max_fights }}
          WCL_MAX_QUERIES_PER_RUN: ${{ inputs.max_queries }}
          WCL_MIN_FIGHT_DURATION_MS: ${{ inputs.min_fight_duration_ms }}
          WCL_TARGET_NEW_PULLS_PER_MEMBER: ${{ inputs.target_new_pulls }}
        run: npm run wcl:refresh

      - name: Commit generated JSON API
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data/wcl api/wcl .nojekyll

          if git diff --cached --quiet; then
            echo "No WCL JSON changes to commit."
            exit 0
          fi

          git commit -m "chore(wcl): refresh incremental guild snapshots"
          git push
